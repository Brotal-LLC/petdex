name: petdex-desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. desktop-v0.1.0)"
        required: true

jobs:
  build-native:
    name: build native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: linux-x64
            runner: ubuntu-latest
          - target: win32-x64
            runner: windows-2022

    steps:
      - name: Checkout petdex
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux GUI libraries
        # gtk4 is the host toolkit and libX11 carries the floating flag
        # (GTK4 dropped gtk_window_set_keep_above, so the window manager
        # is told through _NET_WM_STATE_ABOVE). webp-pixbuf-loader is
        # what lets gdk-pixbuf read a pet at all: 60 of the 63 sheets in
        # the catalog are webp and Ubuntu ships no loader for them.
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libx11-dev pkg-config webp-pixbuf-loader

      - name: Clone the Native SDK
        # petdex-desktop-native needs the floating/transparent/click_through
        # window options and fx.focusWindow, none of which are in
        # vercel-labs/main yet. Pinned by commit for the same reason the
        # zero-native clone above is: a mutable fork branch must not be able
        # to change what a tagged release contains. Point NATIVE_SDK_REMOTE
        # and NATIVE_SDK_REF at vercel-labs/main once those land upstream.
        env:
          NATIVE_SDK_REMOTE: "https://github.com/Railly/native.git"
          NATIVE_SDK_BRANCH: "feat/floating-window-0.5.3"
          NATIVE_SDK_REF: "b749ae5eb6fd759cc49871d2d00ae33d9fd05542"
        # Explicit bash: this job now runs on a Windows runner too, where
        # the default shell is PowerShell and `set -euo pipefail` fails
        # as an unknown parameter before git is ever reached.
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$NATIVE_SDK_BRANCH" "$NATIVE_SDK_REMOTE" "$GITHUB_WORKSPACE/native-sdk"
          git -C "$GITHUB_WORKSPACE/native-sdk" fetch --depth 1 origin "$NATIVE_SDK_REF"
          git -C "$GITHUB_WORKSPACE/native-sdk" checkout --detach "$NATIVE_SDK_REF"
          echo "NATIVE_SDK_PATH=$GITHUB_WORKSPACE/native-sdk" >> "$GITHUB_ENV"

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build the native CLI from the pinned SDK
        # The published @native-sdk/cli carries its own manifest parser, and
        # the released one rejects app.zon's `.floating` with a bare
        # ParseZon. Building the CLI from the same commit as the SDK keeps
        # the parser and the runtime in step.
        working-directory: ${{ env.NATIVE_SDK_PATH }}
        shell: bash
        run: |
          zig build cli
          echo "NATIVE_CLI=$NATIVE_SDK_PATH/zig-out/bin/native" >> "$GITHUB_ENV"

      - name: Build petdex-desktop-native
        working-directory: packages/petdex-desktop-native
        shell: bash
        run: |
          "$NATIVE_CLI" build
          ls -lh zig-out/bin/

      - name: Package the app bundle (macOS)
        # Only macOS gets a bundle: the .app layout is what Finder needs
        # to treat the binary as an application. Linux and Windows ship
        # the executable itself, which is self-contained (agent logos and
        # the state table are compiled in).
        if: matrix.target == 'darwin-arm64'
        working-directory: packages/petdex-desktop-native
        shell: bash
        run: |
          "$NATIVE_CLI" package \
            --target macos \
            --binary zig-out/bin/petdex-desktop-native \
            --output "Petdex.app" \
            --signing adhoc
          # Agent logos are compiled into the binary, so only the app
          # icon still has to survive packaging.
          test -f "Petdex.app/Contents/Resources/assets/icon.png"
          ditto -c -k --keepParent "Petdex.app" "petdex-desktop-native-${{ matrix.target }}.zip"
          # Upgrade bridge: the WebView desktop's updater and `petdex
          # install desktop` both look for petdex-desktop-<target>, so
          # the native binary answers to that name too. Without it the
          # thousands of installs already out there would sit on 0.2.3
          # forever, their updater asking for an asset nobody publishes.
          cp zig-out/bin/petdex-desktop-native "petdex-desktop-${{ matrix.target }}"
          chmod +x "petdex-desktop-${{ matrix.target }}"
          ls -lh "petdex-desktop-native-${{ matrix.target }}.zip" "petdex-desktop-${{ matrix.target }}"

      - name: Stage the binary (Linux)
        if: matrix.target == 'linux-x64'
        working-directory: packages/petdex-desktop-native
        shell: bash
        run: |
          cp zig-out/bin/petdex-desktop-native "petdex-desktop-native-${{ matrix.target }}"
          chmod +x "petdex-desktop-native-${{ matrix.target }}"
          # Same upgrade bridge as macOS, though no Linux build ever
          # shipped under the old name: publishing it keeps the asset
          # table uniform across targets.
          cp zig-out/bin/petdex-desktop-native "petdex-desktop-${{ matrix.target }}"
          chmod +x "petdex-desktop-${{ matrix.target }}"
          ls -lh "petdex-desktop-native-${{ matrix.target }}" "petdex-desktop-${{ matrix.target }}"

      - name: Stage the binary (Windows)
        if: matrix.target == 'win32-x64'
        working-directory: packages/petdex-desktop-native
        shell: bash
        run: |
          cp zig-out/bin/petdex-desktop-native.exe "petdex-desktop-native-${{ matrix.target }}.exe"
          # Upgrade bridge, as on macOS: 474 people downloaded
          # petdex-desktop-win32-x64.exe from 0.2.3 alone.
          cp zig-out/bin/petdex-desktop-native.exe "petdex-desktop-${{ matrix.target }}.exe"
          ls -lh "petdex-desktop-native-${{ matrix.target }}.exe" "petdex-desktop-${{ matrix.target }}.exe"

      - name: Upload native bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: petdex-desktop-native-${{ matrix.target }}
          # One glob for three shapes: a .zip on macOS, a bare ELF on
          # Linux, an .exe on Windows. Only one exists per job.
          path: |
            packages/petdex-desktop-native/petdex-desktop-native-${{ matrix.target }}
            packages/petdex-desktop-native/petdex-desktop-native-${{ matrix.target }}.zip
            packages/petdex-desktop-native/petdex-desktop-native-${{ matrix.target }}.exe
            packages/petdex-desktop-native/petdex-desktop-${{ matrix.target }}
            packages/petdex-desktop-native/petdex-desktop-${{ matrix.target }}.exe
          if-no-files-found: error

  release:
    name: publish github release
    needs: [build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout petdex
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release
          find artifacts -type f -name "petdex-desktop-*" -exec cp {} release/ \;
          test -f release/petdex-desktop-native-darwin-arm64.zip
          test -f release/petdex-desktop-native-linux-x64
          test -f release/petdex-desktop-native-win32-x64.exe
          # The compatibility names existing installs update through.
          test -f release/petdex-desktop-darwin-arm64
          test -f release/petdex-desktop-linux-x64
          test -f release/petdex-desktop-win32-x64.exe
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # `inputs.tag` is set on workflow_dispatch (manual run); on push of
          # a desktop-v* tag, `github.ref_name` carries the tag. The
          # `inputs.tag || github.ref_name` order works because `inputs.tag`
          # is null on tag pushes.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/*
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-rc') }}
